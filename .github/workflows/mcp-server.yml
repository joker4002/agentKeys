name: mcp-server

on:
  push:
    branches: [main]
    paths:
      - "crates/agentkeys-mcp-server/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/mcp-server.yml"
  pull_request:
    paths:
      - "crates/agentkeys-mcp-server/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/mcp-server.yml"

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: test + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: cargo test
        run: cargo test -p agentkeys-mcp-server --all-features
      - name: cargo clippy
        run: cargo clippy -p agentkeys-mcp-server --all-targets -- -D warnings

  image:
    name: build + publish image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/agentkeys-mcp-server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/agentkeys-mcp-server:latest
            ghcr.io/${{ github.repository }}/agentkeys-mcp-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
