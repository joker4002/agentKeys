[package]
name = "agentkeys-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "agentkeys"
path = "src/main.rs"

[lib]
name = "agentkeys_cli"
path = "src/lib.rs"

[dependencies]
agentkeys-types = { workspace = true }
agentkeys-core = { workspace = true }
clap = { version = "4", features = ["derive"] }
tokio = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
keyring = "2"
reqwest = { version = "0.12", features = ["json"] }

# macOS-only: real LAContext biometric gate via objc2 FFI.
# Gated behind target cfg so Linux / Windows builds pay zero cost.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-local-authentication = { version = "0.3", features = ["LAContext", "LAError"] }
block2 = "0.6"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
agentkeys-mock-server = { path = "../agentkeys-mock-server" }
agentkeys-types = { workspace = true }
tokio = { workspace = true }
reqwest = { version = "0.12", features = ["json"] }
axum = { version = "0.7", features = ["json"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde_json = { workspace = true }
tempfile = "3"
